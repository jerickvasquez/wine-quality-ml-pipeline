data:
  url: "https://archive.ics.uci.edu/ml/machine-learning-databases/wine-quality/winequality-red.csv"
  raw_path: "data/winequality-red.csv"
  target_column: "quality"
  quality_threshold: 6
  test_size: 0.2
  random_state: 42

model:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

mlflow:
  experiment_name: "wine-quality-classification"
  model_name: "wine-quality-xgb"
  run_name: "xgboost-run"
