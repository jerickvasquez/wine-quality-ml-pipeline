name: ML Pipeline CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: make install

      - name: Lint code
        run: make lint

      - name: Run tests
        run: make test

      - name: Train model
        run: make train

      - name: Upload MLflow database
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking-db
          path: mlflow.db
          retention-days: 30

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: mlruns/
          retention-days: 30

      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: data/
          retention-days: 7
